# Rebuilds the website's data (ratings, model settings, track record) and publishes the site to
# GitHub Pages. Runs every morning, whenever site code changes on main, and on demand from the
# Actions tab ("Run workflow").
name: Update and publish site

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 7 AM Eastern (6 AM in winter)
  push:
    branches: [main]
    paths: ["site/**", "build_site.py", "sources.py", "model.py", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Past seasons from CollegeFootballData never change, so keep them between runs
      - uses: actions/cache@v6
        with:
          path: data/cfbd
          key: cfbd-v1
      - name: Build site data
        env:
          # Optional: add a CFBD_API_KEY repository secret to include past seasons in the track record
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
